name: Update language stats

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate language stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: NayaraLF
        run: |
          python3 scripts/generate_lang_stats_all_repos.py > /tmp/langs.md

      - name: Update README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path('README.md').read_text()
          new = Path('/tmp/langs.md').read_text()
          start = '<!--languages-start-->'
          end = '<!--languages-end-->'
          if start in readme and end in readme:
              pre = readme.split(start)[0]
              post = readme.split(end)[1]
              updated = pre + new + post
          else:
              updated = readme + '\n' + new
          Path('README.md').write_text(updated)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update language stats" || echo "No changes to commit"
          git push
